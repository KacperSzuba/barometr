# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
org.gradle.parallel=true

# The defaults are too small for this build and fail in a misleading way.
#
# With ~20 subprojects compiling in parallel, and jOOQ's generated sources carrying
# very large generic hierarchies, the Kotlin daemon exhausts its heap. It does not
# report that plainly: the first symptom is "Could not read class .../Row12.class"
# or "Exception during IR lowering" in an unrelated module, and only sometimes the
# actual OutOfMemoryError. Raising the ceiling removes an entire category of
# confusing build failures.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
