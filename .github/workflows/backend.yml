# Every push verified, and every merge to main turned into an image somebody can run.
#
# One workflow for the backend, filtered by path, because this repository is meant to
# grow a web app and an AI service beside it and neither should wait on Gradle to find
# out that a stylesheet changed.
name: backend

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

# A second push to the same branch makes the first one's answer worthless, and a queue
# of stale runs is how a pipeline stops being read.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # The suite starts Postgres, Elasticsearch and a mail server through
    # Testcontainers, and the Elasticsearch image is built rather than pulled. Ten
    # minutes is a ceiling on a stuck run, not a target — the target is under six.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # The toolchain the build asks for. Without it Gradle downloads a JDK on
          # every run, which is a minute of the budget spent on nothing.
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the cache. A pull request reads it, which stops a branch
          # from poisoning everybody else's build and keeps the entry stable.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check
        # `check` is the whole gate: tests, module boundaries, and the modularity rules
        # that are the only thing enforcing them since each context became one module.
        run: ./gradlew check --build-cache --stacktrace

      - name: API contract
        # Written by `OpenApiContractTest` while the suite runs, so the document that
        # gets published is one a booted application actually served rather than one a
        # generator guessed at. The web app builds its TypeScript types from this file;
        # uploaded from every run, because a pull request that changes the contract
        # should be reviewable as a diff of it.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: app/build/openapi/openapi.json
          if-no-files-found: error
          retention-days: 30

      - name: Test reports
        # The reason a run failed is in these, and a red pipeline nobody can diagnose
        # is a pipeline people start ignoring.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  dependencies:
    name: dependency graph
    # What makes Dependabot see this build's actual resolved versions rather than
    # guessing from the catalog, and what turns a new advisory into an alert here.
    # Only from main: a graph submitted from a branch would describe a state that
    # never shipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/dependency-submission@v6

  image:
    name: image
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Built here rather than inside the Dockerfile: a Gradle build in a Docker build
      # downloads the world every time, because the layer cache is not the dependency
      # cache and this job already has one that works.
      - name: Build the jar
        run: ./gradlew :app:bootJar --build-cache

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The commit is the tag. `latest` would make "which code is running" a
          # question nobody can answer afterwards, and rolling back is redeploying the
          # tag that was there before — which only works if tags never move.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
