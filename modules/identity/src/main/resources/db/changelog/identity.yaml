# Everything identity has done to the database, in the order it did it.
#
# Listed one by one rather than with `includeAll`: the order is the point, and a
# directory listing is a worse place to state it than a file somebody reads.
#
# What this schema is built on is stated in db/changelog/master.yaml, not here —
# Liquibase would count a changelog reached from two directions twice.
databaseChangeLog:
  - include:
      file: db/changelog/identity/0001-identity.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/identity/0002-refresh-token-successors.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/identity/0003-user-roles.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/identity/0004-session.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/identity/0005-two-factor.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/identity/0006-trusted-device.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/identity/0007-workspace.sql
      relativeToChangelogFile: false
