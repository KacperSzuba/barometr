spring:
  application:
    name: barometr
  profiles:
    # Local development needs no environment setup; production must set
    # SPRING_PROFILES_ACTIVE=prod explicitly.
    default: local
  threads:
    virtual:
      enabled: true
  liquibase:
    # One entry point. It names the six contexts; each pulls in whatever its own
    # schema is built on, so the order is a consequence of the dependency graph
    # rather than of a filename convention.
    change-log: classpath:db/changelog/master.yaml
  elasticsearch:
    # The search index, which is derived and rebuildable from Postgres at any time.
    # Nothing that cannot be reconstructed depends on it: with the node down the
    # application still archives, derives and answers everything except search.
    #
    # Its health contributor is left enabled, so a node that is down says so. Worth
    # revisiting when there is a deployment: a liveness probe reading the default
    # health group would restart an application that is ingesting perfectly well.
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  modulith:
    events:
      # A publication left incomplete means a listener never ran, and in this system
      # that is a document archived but never derived — invisible, because nothing
      # failed. Every listener is idempotent by construction (content hashes, upserts
      # on natural keys, unique indexes), so redelivering costs nothing and the
      # alternative is derived data quietly missing until somebody counts it.
      republish-outstanding-events-on-restart: true
      jdbc:
        # The register lives in `platform`, beside the other technical tables, and is
        # created by a migration like everything else — `schema-initialization` stays
        # off so the schema has exactly one author.
        schema: platform

server:
  port: 8080
  error:
    # Never leak stack traces or internal messages to a client.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      # `prometheus` and `metrics` are behind the same authentication as everything
      # else, deliberately. A metrics endpoint states how many users, how many
      # documents and which jobs are failing, and opening that to the internet because
      # a scraper cannot hold a token is a decision for a deployment to make on its own
      # network — not a default shipped here.
      exposure:
        include: health, modulith, prometheus, metrics

  tracing:
    sampling:
      # Everything, because the point of tracing here is to follow one document from
      # the fetch to the alert it became — a tenth of that is a tenth of a story. At
      # this volume it costs nothing; a busier deployment lowers it.
      probability: ${TRACING_SAMPLE:1.0}

  otlp:
    tracing:
      # Off unless somebody points it at a collector. With exporting on and nothing
      # listening, the exporter retries into a closed port and fills the log with it —
      # while trace and span ids still appear in every log line either way, which is
      # most of the value on a developer's machine.
      export:
        enabled: ${OTLP_ENABLED:false}
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

app:
  jwt:
    issuer: barometr
    audience: barometr-web
    # Short-lived: this is what substitutes for a revocation list on access tokens.
    access-ttl: 15m
    refresh-ttl: 30d
    # Window in which a second use of an already-rotated refresh token counts as
    # a request race rather than theft. See RefreshTokenService.
    refresh-grace: 15s

  connectors:
    rcl:
      # RCL's robots.txt is `Disallow: /` for every agent, so with the default
      # RESPECT the connector reads nothing at all. Switching to EXEMPT requires
      # a written legal basis of at least twenty characters — the application
      # refuses to start otherwise, and the basis is logged on every run.
      #
      # Enabling the source also means filling in sources.source.legal_basis,
      # which the schema enforces separately. Two locks, one decision.
      robots:
        mode: RESPECT
        legal-basis: ""
      # Levels of catalog to descend. 2 reaches the documents — a stage such as
      # "Konsultacje publiczne" holds five catalogs of its own, and the submitted
      # comments are in one of them. 1 stops at the stages and costs roughly a
      # fifth as many requests. At 0.2 req/s a full replay is about a week at
      # depth 1 and about two months at depth 2; raise requests-per-second once
      # RCL has agreed a pace, rather than lowering the depth.
      catalog-depth: 2
      # Whether a catalog page is followed to the files filed under it — the draft
      # texts, the impact assessments, the tables of comments from consultation.
      # A stage holds a dozen files where it holds one page, so turning this off
      # roughly halves the requests and gives up everything the corpus is made of.
      # Off is a way to back off from a pace RCL objects to without giving up the
      # record of what was filed and when, which the pages still carry.
      fetch-attachments: true
