# Local development dependencies.
#
# Provisioning for real environments is a separate concern; this file exists so
# that `docker compose up -d` followed by `./gradlew :app:bootRun` is all it takes
# to have the application running against the same engine production uses.
#
# Both services are capped. Neither needs a whole laptop to serve one developer, and
# a database that takes every core it can see is why a build feels slow while it is
# actually the editor that is starving. The test containers carry the same caps.

services:
  postgres:
    # pgvector ships on top of the official Postgres image, so embeddings and the
    # relational schema live in one database rather than two systems to operate.
    image: pgvector/pgvector:pg16
    # Two cores and a gigabyte: more than a development dataset needs, and far less
    # than Postgres will take if nobody says otherwise.
    cpus: 0.5
    mem_limit: 1g
    environment:
      POSTGRES_DB: barometr
      POSTGRES_USER: barometr
      POSTGRES_PASSWORD: barometr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barometr -d barometr"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    # Built rather than pulled: the Polish analyser is a plugin Elastic distributes
    # separately, and without it a search for an inflected form finds nothing. See
    # infra/elasticsearch/Dockerfile.
    build: infra/elasticsearch
    # The heap below is 512m; the rest is what Lucene wants for file cache. The core
    # limit matters more here — indexing will use everything it is given.
    cpus: 1
    mem_limit: 1500m
    environment:
      # One node, and no security: this is a derived index on a developer's machine,
      # rebuildable from Postgres at any time, and never the source of truth for
      # anything. Production runs it behind the same network boundary as the database.
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Elasticsearch defaults to half the host's memory, which on a laptop running
      # a database and a JVM is more than it needs for an index this size.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  storage:
    # Google Cloud Storage, emulated. The application talks to this exactly as it talks
    # to the real thing — same client, same API — so `app.storage.kind: gcs` locally
    # exercises the path that actually ships.
    #
    # Not the default here: the filesystem store needs nothing running and leaves the
    # blobs where a developer can open them.
    image: fsouza/fake-gcs-server:1.56.0
    entrypoint: /bin/fake-gcs-server
    # Plain HTTP, because the default is TLS with a certificate nothing here trusts.
    # `-public-host` is what makes the URLs it hands back point at this address rather
    # than at its own idea of itself.
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443"]
    cpus: 1
    mem_limit: 512m
    ports:
      - "4443:4443"
    volumes:
      - storage-data:/storage

volumes:
  postgres-data:
  storage-data:
