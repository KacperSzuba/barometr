spring:
  datasource:
    # Neon connection string, for example:
    #   jdbc:postgresql://ep-xxx-pooler.eu-central-1.aws.neon.tech/barometr?sslmode=require&prepareThreshold=0
    #
    # Two Neon-specific notes:
    #   * sslmode=require is mandatory — Neon rejects plaintext connections.
    #   * the `-pooler` endpoint is PgBouncer in transaction mode, which breaks
    #     server-side prepared statements. Either add prepareThreshold=0 as above
    #     or connect to the direct (non-pooler) endpoint.
    url: ${DATABASE_URL}
    hikari:
      # Neon counts connections against the plan quota, so keep the pool small.
      maximum-pool-size: 5
      minimum-idle: 1
      # Neon scales to zero; waking a suspended branch takes roughly half a second.
      connection-timeout: 30000
      max-lifetime: 300000

app:
  ai:
    # No fallback for either, and for the same reason as the JWT secret: the default
    # base URL is a loopback address, so an unset one would not fail — it would send
    # every inference call at this container's own port 8000 and report the service as
    # unreachable, which is a misconfiguration wearing an outage's clothes. The key is
    # the only thing standing between that service's token budget and anybody who can
    # reach it.
    base-url: ${AI_BASE_URL}
    api-key: ${AI_API_KEY}
    # Which deployment is spending the budget. The service bills against this and tags
    # its own metrics with it, so staging and production must not share one.
    client-id: ${AI_CLIENT_ID:barometr}
  jwt:
    # No fallback: the application must refuse to start without a real secret.
    secret: ${JWT_SECRET}
  identity:
    two-factor:
      # No fallback either, and for the same reason: a TOTP secret stored in the clear
      # is a second factor that a database dump defeats. Unset, the application refuses
      # to enrol anybody rather than quietly storing secrets in plain text — the salt is
      # not a secret, but it must not change once anybody is enrolled.
      encryption-key: ${TOTP_KEY:}
      encryption-salt: ${TOTP_SALT:}
  storage:
    # Object storage by default, and that is the recommendation rather than a
    # preference: the archive is the one thing here that cannot be recomputed, and a
    # directory inside a container means one instance, no replication, and a volume
    # somebody has to remember to back up.
    #
    # `filesystem` remains available for a single-machine deployment, and then
    # `BLOB_ROOT` must name a mounted volume. Either way the application refuses to
    # start without what its chosen kind needs.
    kind: ${BLOB_STORAGE_KIND:gcs}
    root: ${BLOB_ROOT:}
    gcs:
      project: ${GCP_PROJECT:}
      # A bucket name is global to all of Google Cloud, so the three are prefixed:
      # `<prefix>-raw`, `-derived`, `-exports`.
      bucket-prefix: ${GCS_BUCKET_PREFIX:barometr}
      location: ${GCS_LOCATION:europe-central2}
      # No credentials here, deliberately. On Google Cloud the workload proves who it
      # is by its own identity; a key in an environment variable would be a secret to
      # leak, and the only reason to have one would be the S3 compatibility layer this
      # deliberately does not use.
