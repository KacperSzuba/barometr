spring:
  datasource:
    # Provided by compose.yaml in the repository root: `docker compose up -d`.
    #
    # H2 is gone for good from here on. The domain schema uses tstzrange, GiST
    # indexes, pgvector and pg_trgm — an in-memory stand-in could not run the
    # migrations, let alone the queries built on them.
    url: jdbc:postgresql://localhost:5432/barometr
    username: barometr
    password: barometr

app:
  jwt:
    # Development fallback so the application starts with no environment setup.
    # HS256 needs at least 32 bytes. The prod profile has no fallback on purpose.
    secret: ${JWT_SECRET:barometr-local-development-secret-do-not-use-in-production}
  storage:
    # Filesystem blob store for development; S3 arrives with the infra plan.
    #
    # Absolute rather than relative: `bootRun` runs with the `app` module as its
    # working directory, so `./.data` quietly resolved to `app/.data` and the blobs
    # ended up somewhere nobody would look for them.
    root: ${user.home}/.barometr/blobs
  identity:
    workspace:
      # Where an invitation link points. Local only, like the calendar's: a link handed
      # out pointing at localhost is an invitation nobody outside this machine can take.
      invitation-base-url: http://localhost:3000
    two-factor:
      # Development values so a local run can enrol an authenticator. The prod profile
      # has none: a TOTP secret stored in the clear is a second factor a database dump
      # defeats, and the application refuses to enrol anybody without a key.
      encryption-key: ${TOTP_KEY:barometr-local-development-totp-key}
      encryption-salt: ${TOTP_SALT:5c0744940b5c369b}
  alerts:
    calendar:
      # Where a calendar client would reach this API. Local only: on a deployment the
      # feed URL has to name the host Outlook can actually fetch from, and a URL
      # handed out pointing at localhost is a subscription that silently never
      # updates.
      base-url: http://localhost:8080
  jobs:
    poll-interval: 1000
  ingestion:
    # Tighter than production, so a local run does something observable quickly.
    dispatch-interval: 30000

logging:
  level:
    org.springframework.security: INFO
    pl.barometr.ingestion: DEBUG
    pl.barometr.platform: DEBUG
