# Everything legislative has done to the database, in the order it did it.
#
# Listed one by one rather than with `includeAll`: the order is the point, and a
# directory listing is a worse place to state it than a file somebody reads.
#
# What this schema is built on is stated in db/changelog/master.yaml, not here —
# Liquibase would count a changelog reached from two directions twice.
databaseChangeLog:
  - include:
      file: db/changelog/legislative/0001-legislative.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0002-act-reference.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0003-one-pending-match-per-document.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0004-draft-identity-and-stage-facts.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0005-draft-start-and-rcl-identity.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0006-withdrawn-drafts.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0007-consultation.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0008-catalog-folder.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0009-consultation-sweep.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0010-consultations-read-from-card.sql
      relativeToChangelogFile: false
  - include:
      file: db/changelog/legislative/0011-draft-continuation.sql
      relativeToChangelogFile: false
